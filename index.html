<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e63946" />
  <title>PokéDex Explorer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap');
    :root { --red:#e63946; --ink:#1f2937; --muted:#64748b; --paper:#fffdf9; --line:#e5e7eb; --blue:#2563eb; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#f3f6fb; font-family:'DM Sans',sans-serif; }
    .hero { background:radial-gradient(circle at 83% 20%,#ff8b8b 0 5%,transparent 5.3%),linear-gradient(125deg,#bd1d35,#ef4855); color:white; padding:42px 5vw 70px; position:relative; overflow:hidden; }
    .hero:after { content:''; position:absolute; width:310px;height:310px;border:25px solid rgba(255,255,255,.15);border-radius:50%;right:-85px;bottom:-175px; }
    .brand, main { max-width:1260px; margin:auto; position:relative; z-index:1; }.brand { display:flex; align-items:center; gap:12px; font-family:Fredoka,sans-serif; font-size:1.35rem; }.ball { width:31px;height:31px;border:3px solid white;border-radius:50%;background:white;position:relative;display:grid;place-items:center;overflow:hidden;flex:none; }.ball:before {content:'';position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:#26313e;}.ball:after {content:'';width:11px;height:11px;box-sizing:border-box;border:3px solid #26313e;border-radius:50%;background:white;position:relative;z-index:1;}
    h1 { font:700 clamp(2.2rem,5vw,4.25rem)/1 Fredoka,sans-serif; margin:52px 0 12px; max-width:650px; }.hero p { font-size:1.08rem; opacity:.9; max-width:580px; }.search-wrap{max-width:680px;position:relative;margin-top:28px}.search { display:flex; width:100%; background:white; padding:6px; border-radius:16px; box-shadow:0 12px 30px #7f152880; }.search input { border:0; outline:0; flex:1; padding:12px 14px; min-width:0; font:inherit; color:var(--ink); }.search button, .primary { border:0; border-radius:11px; padding:13px 20px; background:#243246; color:white; font:700 .95rem inherit; cursor:pointer; transition:.2s; }.search button:hover,.primary:hover { transform:translateY(-1px); background:#101b2b; }.suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);background:white;color:var(--ink);border-radius:13px;box-shadow:0 14px 30px #17203338;overflow:hidden;z-index:5;border:1px solid #e5e7eb}.suggestions.show{display:block}.suggestion{display:flex;width:100%;align-items:center;gap:10px;border:0;border-bottom:1px solid #eef0f4;padding:10px 15px;background:white;text-align:left;font:inherit;cursor:pointer}.suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion:focus{background:#f2f6fc;outline:none}.suggestion-id{font-weight:700;color:var(--red);min-width:62px}.suggestion-name{text-transform:capitalize;font-weight:600}
    main { margin-top:-35px; padding:0 5vw 45px; }.notice { display:none; padding:13px 16px; border-radius:12px; margin:0 0 20px; background:#fff4d6; color:#854d0e; }.notice.error { background:#fee2e2;color:#991b1b; }.notice.visible { display:block; }.loading { display:none; align-items:center;gap:10px; color:var(--muted); padding:12px 0; }.loading.visible {display:flex}.spinner {width:20px;height:20px;border:3px solid #dce4ee;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .panel { background:var(--paper); border:1px solid #eef0f4; box-shadow:0 10px 28px #26324a12; border-radius:20px; }.detail { display:none; padding:clamp(18px,4vw,38px); margin-bottom:28px; }.detail.show{display:block}.detail-head{display:grid;grid-template-columns:minmax(190px,.75fr) 1.5fr;gap:34px;align-items:center}.art{width:100%;max-width:290px;aspect-ratio:1;object-fit:contain;background:radial-gradient(circle,#f7e3e5,#f5f7fb 64%);border-radius:50%;padding:12px}.eyebrow{color:var(--red);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}.detail h2{font:700 clamp(2rem,4vw,3.4rem)/1 Fredoka,sans-serif;margin:8px 0 18px;text-transform:capitalize}.chips,.ability-list{display:flex;gap:8px;flex-wrap:wrap}.chip{color:white;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;background:#64748b}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.fact{background:#f5f7fb;border-radius:12px;padding:10px}.fact strong{display:block;font-size:.79rem;color:var(--muted);margin-bottom:2px}.detail-sections{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.subpanel{background:#f7f9fc;border-radius:15px;padding:18px}.subpanel h3{margin:0 0 12px;font:600 1.18rem Fredoka,sans-serif}.ability-item{border-left:3px solid var(--red);padding:5px 0 5px 10px;margin-bottom:10px}.ability-item b{text-transform:capitalize}.muted{color:var(--muted);font-size:.92rem;line-height:1.45}.evolutions{display:flex;align-items:stretch;gap:9px;flex-wrap:wrap}.evo{border:1px solid var(--line);background:white;border-radius:12px;padding:9px;min-width:100px;flex:1;text-align:center;text-transform:capitalize;font-weight:700;font-size:.9rem}.evo img{width:65px;height:65px;object-fit:contain;display:block;margin:auto}.arrow{align-self:center;color:var(--red);font-weight:bold}.branch{display:flex;align-items:center;gap:9px;width:100%}.filters{padding:22px;margin-bottom:23px}.filter-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.filter-top h2,.catalog-title{font:600 1.35rem Fredoka,sans-serif;margin:0}.clear{border:0;background:transparent;color:var(--blue);font:700 .9rem inherit;cursor:pointer}.type-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.type-filter{border:1px solid #dce2ea;background:white;border-radius:999px;padding:7px 11px;cursor:pointer;font:600 .83rem inherit;color:#425168}.type-filter.selected{background:#243246;border-color:#243246;color:white}.catalog-bar{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 14px}.count{color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}.card{border:1px solid #e7eaf0;background:white;border-radius:16px;padding:13px;cursor:pointer;transition:.2s;text-align:left;color:inherit;font:inherit;min-height:235px}.card:hover{transform:translateY(-4px);box-shadow:0 9px 22px #1720331f;border-color:#cbd5e1}.card img{width:100%;height:128px;object-fit:contain;background:#f5f7fb;border-radius:11px}.card-no{color:var(--muted);font-size:.78rem;font-weight:700;display:block;margin-top:8px}.card-name{display:block;font:600 1.1rem Fredoka,sans-serif;text-transform:capitalize;margin:2px 0 7px}.card .chip{font-size:.69rem;padding:3px 8px}.pagination{display:flex;justify-content:center;gap:12px;align-items:center;margin:28px}.pagination button{border:0;border-radius:8px;padding:8px 13px;background:#e5eaf1;color:#314158;font:600 inherit;cursor:pointer}.pagination button:disabled{opacity:.45;cursor:not-allowed}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .evo{color:var(--ink);position:relative;cursor:pointer;transition:.2s}.evo:hover,.evo:focus-visible{border-color:var(--red);box-shadow:0 7px 18px #17203320;transform:translateY(-2px);outline:none}.evo small{display:block;color:var(--red);margin-top:3px}.evo-tooltip{display:none;position:absolute;z-index:4;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);width:185px;padding:10px;border-radius:10px;background:#243246;color:white;text-align:left;font:500 .77rem/1.4 'DM Sans',sans-serif;text-transform:none;box-shadow:0 8px 18px #17203342}.evo-tooltip:after{content:'';position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#243246}.evo:hover .evo-tooltip,.evo:focus-visible .evo-tooltip{display:block}.evo-tooltip b{display:block;text-transform:capitalize;font:700 .95rem Fredoka,sans-serif;margin-bottom:3px}.evo-tooltip .chips{gap:4px;margin:5px 0}.evo-tooltip .chip{font-size:.65rem;padding:2px 6px}
    @media(max-width:650px){.hero{padding-top:26px;padding-bottom:57px}.hero h1{margin-top:35px}.detail-head,.detail-sections{grid-template-columns:1fr}.art{max-width:210px;margin:auto}.facts{grid-template-columns:repeat(2,1fr)}.detail-sections{gap:13px}.search button{padding:12px}.branch{flex-wrap:wrap}.arrow{transform:rotate(90deg)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:210px;padding:10px}.card img{height:105px}}
  </style>
</head>
<body>
  <header class="hero"><div class="brand"><span class="ball" aria-hidden="true"></span> PokéDex Explorer</div><h1>Encuentra a tu próximo compañero.</h1><p>Explora especies, tipos, habilidades y rutas evolutivas con datos oficiales de PokéAPI.</p><div class="search-wrap"><form class="search" id="search-form"><label class="sr" for="search-input">Nombre o número de Pokémon</label><input id="search-input" placeholder="Ej. Pikachu, 25, Charizard…" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" /><button id="search-button" type="submit">Buscar</button></form><div id="suggestions" class="suggestions" role="listbox" aria-label="Sugerencias de Pokémon"></div></div></header>
  <main>
    <div id="notice" class="notice" role="alert"></div><div id="loading" class="loading" aria-live="polite"><span class="spinner"></span><span id="loading-text">Cargando Pokémon…</span></div>
    <section id="detail" class="detail panel" aria-live="polite"></section>
    <section class="filters panel"><div class="filter-top"><h2>Filtrar por tipo</h2><button id="clear-filters" class="clear" type="button">Limpiar filtros</button></div><p class="muted">Al seleccionar varios tipos, verás solo Pokémon que tengan <b>todos</b> ellos.</p><div id="type-filters" class="type-filters"></div></section>
    <section><div class="catalog-bar"><h2 class="catalog-title">Catálogo Pokémon</h2><span id="catalog-count" class="count"></span></div><div id="catalog" class="grid" aria-live="polite"></div><div class="pagination"><button id="prev-page" type="button">← Anterior</button><span id="page-label"></span><button id="next-page" type="button">Siguiente →</button></div></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
